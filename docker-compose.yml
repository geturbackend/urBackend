
services:
  # ── MongoDB ───────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: urbackend_mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status() } catch (err) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})
          }; db.hello().isWritablePrimary' | grep true
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: urbackend_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ── Dashboard API (Admin Server) ─────────────────────────────────────────────
  dashboard-api:
    build:
      context: .
      dockerfile: ./apps/dashboard-api/Dockerfile
    container_name: urbackend_dashboard
    restart: unless-stopped
    ports:
      - '1234:1234'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      # Override DB URLs to use Docker service names
      MONGO_URL: mongodb://mongo:27017/urbackend?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 1234

  # ── Public API (User Server) ──────────────────────────────────────────────────
  public-api:
    build:
      context: .
      dockerfile: ./apps/public-api/Dockerfile
    container_name: urbackend_public
    restart: unless-stopped
    ports:
      - '1235:1235'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017/urbackend?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      USER_PORT: 1235

  # ── Web Dashboard (Frontend) ──────────────────────────────────────────────────
  web-dashboard:
    build:
      context: .
      dockerfile: ./apps/web-dashboard/Dockerfile
      args:
        - VITE_API_URL=http://localhost:1234
        - VITE_PUBLIC_URL=http://localhost:1235
    container_name: urbackend_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - dashboard-api

  # ── Web Client (Next.js 14 + shadcn/ui) ──────────────────────────────────────
  web-client:
    build:
      context: .
      dockerfile: ./apps/web-client/Dockerfile
    container_name: urbackend_web_client
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - dashboard-api
      - public-api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:1235
      NEXT_PUBLIC_DASHBOARD_API_URL: http://localhost:1234
      PORT: 3000
      NODE_ENV: production

volumes:
  mongo_data:
  redis_data:
